<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mas inputs</title>

</head>
<body>
    
<form action="#" method="post">
    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password">
      </imput>
    </div>

    <div>
        <label for="edad">Edad:</label>
        <input  type="number" name="edad" id="edad" min="18" max="65">
    </div>

    <div>
        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" name="fecha" id="fecha">
    </div>

    <div>
        <label for="color">Color favorito:</label>
        <input type="color" name="color" id="color">
    </div>

        <fieldset>
        <legend>Sexo:</legend>
        <input type="radio" name="sexo" id="hombre" value="hombre">
        <label for="hombre">Hombre</label> 
        
        <input type="radio" name="sexo" id="mujer" value="mujer">
        <label for="mujer">Mujer</label>

        <label></label>
        </fieldset>
        <legend>Intereses:</legend>
        <input type="checkbox" name="intereses" id="deportes" value="deportes">
        <label for="deportes">Deportes</label>
        <input type="checkbox" name="intereses" id="música" value="música">
        <label for="música">Música</label>
        <input type="checkbox" name="intereses" id="lectura" value="lectura">
        <label for="lectura">Lectura</label>
        </fieldset>

        <Div>
            <label for="pais">País:</label>
            <select name="pais" id="pais">
                <option value="argentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="chile">Chile</option>
                <option value="colombia">Colombia</option>
                <option value="mexico">México</option>
            </select>
        </Div>
        

</form>


</body>
</html>
